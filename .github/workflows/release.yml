name: Release binaries
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: bash scripts/build.sh "${GITHUB_REF_NAME}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "simpleHtmlWatch $GITHUB_REF_NAME")
          if [[ -f "docs/releases/${GITHUB_REF_NAME}.md" ]]; then
            flags+=(--notes-file "docs/releases/${GITHUB_REF_NAME}.md")
          else
            flags+=(--generate-notes)
          fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/simpleHtmlWatch_"${GITHUB_REF_NAME}"_*.zip dist/simpleHtmlWatch_"${GITHUB_REF_NAME}"_*.tar.gz "dist/cluster-task-controller_${GITHUB_REF_NAME}.zip" "dist/simplehtmlwatch-netdata_${GITHUB_REF_NAME}.zip" "dist/AI-GLOBAL-PROMPT_${GITHUB_REF_NAME}.md" dist/WINDOWS-INSTALL.md dist/SHA256SUMS "dist/package-verification_${GITHUB_REF_NAME}.json" "${flags[@]}"
